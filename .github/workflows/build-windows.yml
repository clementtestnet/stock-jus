name: Compiler Stock Jus exe Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Telecharger le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter reportlab pillow

      - name: Compiler le exe avec PyInstaller
        run: |
          python -m PyInstaller stock_jus.spec --noconfirm --clean

      - name: Copier la base de donnees
        shell: pwsh
        run: |
          if (Test-Path "stock_jus.db") {
            Copy-Item "stock_jus.db" "dist\StockJus\"
          }

      - name: Verifier que le exe existe
        shell: pwsh
        run: |
          if (!(Test-Path "dist\StockJus\StockJus.exe")) {
            Write-Error "StockJus.exe introuvable !"
            exit 1
          }
          Write-Host "StockJus.exe cree avec succes !"

      - name: Creer le ZIP complet
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\StockJus\*" -DestinationPath "StockJus-Windows.zip"
          Write-Host "ZIP cree : StockJus-Windows.zip"

      - name: Uploader le ZIP comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: StockJus-Windows-EXE
          path: StockJus-Windows.zip
          retention-days: 30

      - name: Creer une Release GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v5.0-build-${{ github.run_number }}
          name: "Stock Jus v5.0 - Build ${{ github.run_number }}"
          body: |
            ## Telecharger Stock Jus pour Windows

            Clique sur StockJus-Windows.zip ci-dessous
            Extrais le ZIP n importe ou sur ton PC
            Double-clique sur StockJus.exe

            Aucune installation de Python requise !
          files: StockJus-Windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
